vscode:
  extensions:
    - 'Catppuccin.catppuccin-vsc'
    - 'Catppuccin.catppuccin-vsc-icons'
    - 'mkhl.direnv'
  modules:
    python_dev:
      extensions:
        - 'ms-python.python'
        - 'ms-python.vscode-pylance'
        - 'charliermarsh.ruff'

packages:
  darwin:
    core:
      brews:
        - 'fish'
        - 'starship'
        - 'git'
        - 'bat'
        - 'eza'
        - 'fd'
        - 'fzf'
        - 'ripgrep'
        - 'zoxide'
        - 'rip2'
        - 'dust'
        - 'dysk'
        - 'procs'
        - 'sd'
        - 'choose-rust'
        - 'hyperfine'
        - 'bottom'
        - 'direnv'
        - 'uv'
        - 'rust'
        - 'gh'
        - 'mergiraf'
      casks:
        - 'font-fira-code-nerd-font'
    modules:
      editor:
        brews:
          - 'neovim'
        casks: []
      terminal:
        brews: []
        casks:
          - 'ghostty'
      git_advanced:
        brews:
          - 'difftastic'
          - 'git-cliff'
          - 'git-lfs'
          - 'git-extras'
          - 'tuicr'
        casks: []
      atuin:
        brews:
          - 'atuin'
        casks: []
      python_dev:
        brews: []
        casks: []
      pre_commit:
        brews: []
        casks: []
      prek:
        brews: []
        casks: []
      gcloud:
        brews: []
        casks:
          - 'gcloud-cli'
      colima:
        brews:
          - 'colima'
        casks: []
      multiplexer:
        brews:
          - 'zellij'
        casks: []
      terraform:
        brews:
          - 'hashicorp/tap/terraform'
        casks: []
      opentofu:
        brews:
          - 'opentofu'
        casks: []

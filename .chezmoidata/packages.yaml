vscode:
  extensions:
    - 'Catppuccin.catppuccin-vsc'
    - 'Catppuccin.catppuccin-vsc-icons'
    - 'mkhl.direnv'
  modules:
    python_dev:
      extensions:
        - 'ms-python.python'
        - 'ms-python.vscode-pylance'
        - 'charliermarsh.ruff'

packages:
  darwin:
    core:
      brews:
        - 'fish'
        - 'starship'
        - 'git'
        - 'gh'
        - 'mergiraf'
        - 'uv'
        - 'fnm'
      casks:
        - 'font-fira-code-nerd-font'
    modules:
      editor:
        brews:
          - 'neovim'
        casks: []
      shell_tools:
        brews:
          - 'bat'
          - 'eza'
          - 'fd'
          - 'fzf'
          - 'ripgrep'
          - 'zoxide'
          - 'direnv'
        casks: []
      cli_extras:
        brews:
          - 'rip2'
          - 'dust'
          - 'dysk'
          - 'procs'
          - 'sd'
          - 'choose-rust'
          - 'hyperfine'
          - 'bottom'
        casks: []
      rust:
        brews:
          - 'rust'
        casks: []
      review:
        brews:
          - 'tuicr'
        casks: []
      ghostty:
        brews:
          - 'zellij'
        casks:
          - 'ghostty'
      cmux:
        taps:
          - 'manaflow-ai/cmux'
        brews: []
        casks:
          - 'manaflow-ai/cmux/cmux'
      git_advanced:
        brews:
          - 'difftastic'
          - 'git-cliff'
          - 'git-lfs'
          - 'git-extras'
          - 'lazygit'
        casks: []
      atuin:
        brews:
          - 'atuin'
        casks: []
      python_dev:
        brews: []
        casks: []
      pre_commit:
        brews: []
        casks: []
      prek:
        brews: []
        casks: []
      gcloud:
        brews: []
        casks:
          - 'gcloud-cli'
      kubernetes:
        brews:
          - 'kubernetes-cli'
          - 'k9s'
        casks: []
      data:
        brews:
          - 'duckdb'
        casks: []
      azure:
        brews:
          - 'azure-cli'
        casks: []
      containers:
        brews:
          - 'colima'
          - 'docker'
          - 'docker-buildx'
          - 'lazydocker'
        casks: []
      terraform:
        taps:
          - 'hashicorp/tap'
        brews:
          - 'hashicorp/tap/terraform'
        casks: []
      opentofu:
        brews:
          - 'opentofu'
        casks: []

vscode:
  extensions:
    - 'Catppuccin.catppuccin-vsc'
    - 'Catppuccin.catppuccin-vsc-icons'
    - 'ms-python.python'
    - 'ms-python.vscode-pylance'
    - 'charliermarsh.ruff'
  modules: {}

packages:
  darwin:
    core:
      brews:
        - 'fish'
        - 'starship'
        - 'git'
        - 'bat'
        - 'eza'
        - 'fd'
        - 'fzf'
        - 'ripgrep'
        - 'zoxide'
        - 'rip2'
        - 'dust'
        - 'bottom'
        - 'direnv'
        - 'uv'
        - 'rust'
        - 'gh'
      casks:
        - 'font-fira-code-nerd-font'
        - 'visual-studio-code'
    modules:
      editor:
        brews:
          - 'neovim'
        casks: []
      terminal:
        brews: []
        casks:
          - 'ghostty'
      git_advanced:
        brews:
          - 'jj'
          - 'mergiraf'
          - 'difftastic'
          - 'git-cliff'
          - 'git-lfs'
        casks: []
      atuin:
        brews:
          - 'atuin'
        casks: []
      python_dev:
        brews: []
        casks: []
      gcloud:
        brews: []
        casks:
          - 'gcloud-cli'
      colima:
        brews:
          - 'colima'
        casks: []
      multiplexer:
        brews:
          - 'zellij'
        casks: []
      aerospace:
        brews: []
        casks:
          - 'nikitabobko/tap/aerospace'
      onepassword:
        brews: []
        casks:
          - '1password'
          - '1password-cli'

# Agent-skill sync config. The actual skill list is NOT here — it lives
# in the private companion repo https://github.com/artefactory/skills,
# which is the single source of truth:
#   - skills/<name>/SKILL.md   custom skills authored by the team
#   - recommended-skills.txt   pointers to external skills worth installing
# This keeps artefiles itself skill-list-agnostic: adding/removing a
# skill never touches this repo, only artefactory/skills.

# Agents the team actually uses. Values must match gh skill's supported
# --agent identifiers (see `gh skill install --help`).
agentSkillTargets:
  - 'claude-code'
  - 'github-copilot'
  - 'codex'
  - 'gemini-cli'

# The org's shared skills repo (custom skills + recommended-skills.txt).
orgSkillsRepo: 'artefactory/skills'

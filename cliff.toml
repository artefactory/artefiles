# git-cliff configuration: turns conventional commits into release notes.
# https://git-cliff.org/docs/configuration
#
# Goal: someone who has this setup installed reads one release and knows what changed
# for them and whether they must do something. So breaking changes come first with their
# migration note, the rest is grouped by what it means to a user (not by commit type
# alphabetically), and internal noise (tests, dependency bumps, release chores) is left out.
#
# Every commit is one merged pull request and carries its issues as `Closes #N` footers,
# so entries link the commit and its issues without calling the GitHub API (no token).
#
# `output` is deliberately unset: git-cliff would otherwise rewrite a file and print
# nothing. Callers choose with `-o`.

[changelog]
header = """
# Changelog

Releases use calendar versions, `YYYY.MM.PATCH`. Breaking changes are listed first in
each release, with what to do about them.
"""
body = """
{%- macro print_commit(commit) -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
  ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))
  {%- set issues = commit.footers | filter(attribute="token", value="Closes") -%}
  {%- if issues | length > 0 %} - closes \
    {% for footer in issues -%}
      [#{{ footer.value | trim_start_matches(pat="#") }}](<REPO>/issues/{{ footer.value | trim_start_matches(pat="#") }})
      {%- if not loop.last %}, {% endif -%}
    {%- endfor -%}
  {%- endif -%}
{%- endmacro print_commit -%}

{%- if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}

### ⚠ Breaking changes

{% for commit in breaking -%}
{{ self::print_commit(commit=commit) }}
{% if commit.breaking_description and commit.breaking_description != commit.message -%}
{{ commit.breaking_description | trim | indent(prefix="  ", first=true) }}
{% endif -%}
{%- endfor %}
{%- endif %}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}

{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
{{ self::print_commit(commit=commit) }}
{% endfor -%}
{%- for commit in commits -%}
{% if not commit.scope -%}
{{ self::print_commit(commit=commit) }}
{% endif -%}
{%- endfor -%}
{%- endfor %}
{%- if version and previous.version %}

**Full changelog**: [{{ previous.version }}...{{ version }}](<REPO>/compare/{{ previous.version }}...{{ version }})
{%- endif %}

"""
footer = """
<!-- generated by git-cliff -->
"""
# The blank lines kept around each release come out of the postprocessors below.
trim = false
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/artefactory/artefiles" },
  # Tera leaves a variable number of blank lines around its tags: one blank line between
  # blocks, and always one before a release heading.
  { pattern = '\n{3,}', replace = "\n\n" },
  { pattern = '([^\n])\n(## \[)', replace = "$1\n\n$2" },
]

[git]
conventional_commits = true
# A commit that is not a conventional commit cannot be grouped, so it stays out.
filter_unconventional = true
split_commits = false
# A breaking commit is never dropped by a skip rule below.
protect_breaking_commits = true
# The group names start with an HTML comment holding their rank: git-cliff sorts groups
# by name, and the comment is stripped (`striptags`) when the title is printed.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^refactor|^build|^ci", group = "<!-- 4 -->Maintenance" },
  # Not release notes: tests, formatting, dependency bumps and the release itself.
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore\\(release", skip = true },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^chore", group = "<!-- 4 -->Maintenance" },
]
filter_commits = false
tag_pattern = "v[0-9]{4}\\.[0-9]{2}\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

name: installer

# install.sh smoke. Separate from ci.yml so the slow OS-bootstrap path
# only runs when install.sh changes. The actual --dry-run behavior is
# covered by tests/install_sh.bats in the bats-{linux,macos} jobs.

on:
  push:
    branches: [main]
    paths: ['install.sh', '.github/workflows/installer.yml']
  pull_request:
    paths: ['install.sh', '.github/workflows/installer.yml']

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: shellcheck install.sh
        run: shellcheck install.sh
      - name: parse-only
        run: bash -n install.sh

name: ci

# CI installs artefiles on fresh GitHub runners with install.sh and checks the
# result. The bats suite under tests/ is for local debugging and does not run
# in CI.
#
# The work is tiered so that most pushes cost little. GitHub bills every job
# rounded up to the next minute and a macOS minute as ten Linux minutes, so
# pushes run few, Linux-only jobs:
# - a draft pull request, or one stacked on another branch, runs nothing;
# - a ready pull request on main runs lint and a full install from the
#   checkout, packages included, on Linux (about 2 minutes);
# - the merge queue adds macOS and the Quick Start route, once per batch of
#   queued pull requests; the Quick Start route runs no scripts and downloads
#   no externals, which the full install already covers;
# - ci-ok sums up every tier and is the one check the merge queue requires.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels its running checks; a queue run never is.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Only pull requests are filtered by path; the queue and manual runs test everything.
  # Lint shares this job: a job of its own would bill a whole extra minute.
  changes:
    name: changes and lint
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            lint:
              - '**/*.sh'
              - '**/*.bash'
              - '.github/workflows/ci.yml'
            install:
              - '*.sh'
              - '.chezmoi*'
              - '.chezmoidata/**'
              - '.chezmoiscripts/**'
              - '.chezmoitemplates/**'
              - 'dot_**'
              - 'private_dot_**'
              - 'Library/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
      - name: shellcheck
        if: github.event_name != 'pull_request' || steps.filter.outputs.lint == 'true'
        run: |
          # Lint every *.sh / *.bash file with a shebang. .tmpl files contain
          # chezmoi template syntax shellcheck can't parse.
          mapfile -t files < <(grep -rIl --include='*.sh' --include='*.bash' '^#!/' . \
            | grep -v -E '\.(tmpl|disabled)$' || true)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -x "${files[@]}"
          fi

  install:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.install == 'true')
    name: install (${{ matrix.os }}, ${{ matrix.route }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests install on Linux; the queue and manual runs add macOS
        # and the Quick Start route.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-15"]') }}
        # full: install.sh run from a clone, every script and external included,
        # as a new user gets it. quick-start: the README one-liner, where chezmoi
        # clones the branch itself (the queue's own branch in the merge queue).
        route: ${{ fromJSON(github.event_name == 'pull_request' && '["full"]' || '["full", "quick-start"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # install.sh logs gh in with it and lends it to chezmoi for the GitHub API.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: install chezmoi
        if: matrix.route == 'quick-start'
        run: |
          # Download to a file: `sh -c "$(curl ...)"` runs an empty script and
          # exits 0 when the download fails, leaving no chezmoi on the runner.
          curl -fsSL --retry 3 --retry-all-errors https://get.chezmoi.io -o "$RUNNER_TEMP/get-chezmoi.sh"
          sh "$RUNNER_TEMP/get-chezmoi.sh" -b "$RUNNER_TEMP/chezmoi"
          "$RUNNER_TEMP/chezmoi/chezmoi" --version

      - name: never run scripts or download externals
        if: matrix.route == 'quick-start'
        run: |
          # No chezmoi setting skips scripts on apply or update, so a chezmoi
          # first on PATH adds the exclusion to the commands that run them. An
          # excluded external is still downloaded, so every command also sets
          # ciSkipExternals, which leaves .chezmoiexternal.toml.tmpl empty.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/chezmoi" << EOF
          #!/bin/sh
          case "\$1" in
            apply | update) exec "$RUNNER_TEMP/chezmoi/chezmoi" --override-data '{"ciSkipExternals":true}' "\$@" --exclude=scripts ;;
          esac
          exec "$RUNNER_TEMP/chezmoi/chezmoi" --override-data '{"ciSkipExternals":true}' "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/bin/chezmoi"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The Linux image links its own miniconda's conda into /usr/bin. Deleting
      # that miniconda takes about 40 seconds and checks nothing a user's machine
      # needs, so only the link goes and the conda remover finds nothing.
      - name: hide the runner's conda
        if: runner.os == 'Linux' && matrix.route == 'full'
        run: |
          conda_cmd=$(command -v conda || true)
          if [ -n "$conda_cmd" ]; then sudo rm -f "$conda_cmd"; fi
          if command -v conda; then exit 1; fi

      - name: install from the checkout
        if: matrix.route == 'full'
        run: sh ./install.sh

      - name: install with the Quick Start one-liner
        if: matrix.route == 'quick-start'
        env:
          ARTEFILES_VERSION: ${{ github.ref_name }}
        # The README pipes install.sh from curl into `sh -c`; reading the
        # checked-out copy runs the same code without a download.
        run: sh -c "$(cat install.sh)"

      - name: verify the install
        run: sh .github/scripts/verify-install.sh "${{ github.sha }}"

      - name: the installed tools run
        if: matrix.route == 'full'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fish --version
          starship --version
          git --version

      # The health check users run after an install: it returns 1 on a missing
      # tool of a selected module, a missing managed config, a forbidden tool
      # or a chezmoi doctor check that failed or found an error.
      - name: dotfiles_doctor finds no problem
        if: matrix.route == 'full'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fish -c dotfiles_doctor

      # The Quick Start route runs no scripts, so their templates are rendered
      # here: a dry run renders every script it would run and fails on a
      # template error. The real chezmoi, not the wrapper, which would exclude them.
      - name: render every script without running it
        if: matrix.route == 'quick-start'
        run: '"$RUNNER_TEMP/chezmoi/chezmoi" apply --dry-run --override-data ''{"ciSkipExternals":true}'''

      # The installed macOS .gitconfig sends GitHub over SSH, so updates on a Mac
      # need a GitHub SSH key (a README prerequisite). A runner has none, so this
      # checks the route chezmoi update takes, not the pull itself.
      - name: on macOS, chezmoi update pulls over SSH
        if: runner.os == 'macOS'
        run: |
          url=$(git -C "$(chezmoi source-path)" ls-remote --get-url origin)
          echo "chezmoi update pulls from ${url}"
          case "$url" in ssh://git@github.com/* | git@github.com:*) ;; *) exit 1 ;; esac

      - name: chezmoi update
        if: matrix.route == 'quick-start'
        # The installed macOS .gitconfig sends GitHub URLs over SSH, and a runner
        # has no SSH key: the pull ignores that file and uses HTTPS.
        env:
          GIT_CONFIG_GLOBAL: /dev/null
        run: chezmoi update

      # Last: it re-runs init with another destination. The destination
      # handling is the same on both systems, so macOS minutes are not spent on it.
      - name: install into a folder that does not exist yet
        if: matrix.route == 'full' && runner.os == 'Linux'
        run: |
          dest="$RUNNER_TEMP/new/home"
          sh ./install.sh --destination "$dest"
          for target in .config/fish/config.fish .config/starship.toml .gitconfig; do
            test -s "${dest}/${target}" || {
              echo "${dest}/${target} was not written" >&2
              exit 1
            }
          done

  # The single required check: green when every job above passed or was skipped
  # by its tier, red when one failed or was cancelled.
  ci-ok:
    if: always()
    needs: [changes, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every check passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
